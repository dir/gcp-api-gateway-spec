swagger: "2.0"
info:
  title: Type Property Regression
  version: "1.0.0"
paths:
  /users/{userId}:
    get:
      responses:
        "200":
          description: A user
          schema:
            $ref: "#/definitions/UserResource"
definitions:
  UserResource:
    type: object
    properties:
      id:
        type: integer
      type:
        type: string
      status:
        type: ["string", "null"]
  EventResource:
    type: object
    properties:
      type:
        type: string
        enum:
          - created
          - updated
          - deleted
      payload:
        type: object
        properties:
          type:
            type: object
            properties:
              kind:
                type: ["integer", "null"]
