swagger: '2.0'
info:
  title: Petstore
  description: 'A sample API used as a characterization fixture'
  version: 1.0.0
basePath: /v1
schemes:
  - https
produces:
  - application/json
consumes:
  - application/json
securityDefinitions:
  auth0:
    authorizationUrl: 'https://example.auth0.com/authorize'
    flow: implicit
    type: oauth2
    x-google-issuer: 'https://example.auth0.com/'
    x-google-jwks_uri: 'https://example.auth0.com/.well-known/jwks.json'
    x-google-audiences: 'https://example.com'
host: api.example.com
x-google-backend:
  address: 'https://backend.example.com'
paths:
  /pets:
    get:
      security:
        -
          auth0: []
      x-google-backend:
        path_translation: APPEND_PATH_TO_ADDRESS
        address: 'https://backend.example.com'
      summary: 'List pets'
      tags:
        - pets
      responses:
        '200':
          description: 'Successful response'
          schema:
            type: object
    post:
      security: []
      x-google-backend:
        path_translation: APPEND_PATH_TO_ADDRESS
        address: 'https://backend.example.com'
      summary: 'Create a pet'
      consumes:
        - multipart/form-data
      parameters:
        -
          name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/Pet'
      responses:
        '200':
          description: 'Successful response'
          schema:
            type: object
  '/pets/{petId}':
    get:
      security:
        -
          auth0: []
      x-google-backend:
        path_translation: APPEND_PATH_TO_ADDRESS
        address: 'https://backend.example.com'
      summary: 'Get a pet (petId parameter is injected by the generator)'
      responses:
        '200':
          description: 'Successful response'
          schema:
            type: object
      parameters:
        -
          name: petId
          in: path
          required: true
          type: string
  '/pets/{petId}/photos/{photoId}':
    delete:
      security:
        -
          auth0: []
      x-google-backend:
        path_translation: APPEND_PATH_TO_ADDRESS
        address: 'https://backend.example.com'
      summary: 'Delete a photo (photoId parameter is injected, petId is declared)'
      parameters:
        -
          name: petId
          in: path
          required: true
          type: string
        -
          name: photoId
          in: path
          required: true
          type: string
      responses:
        '200':
          description: 'Successful response'
          schema:
            type: object
definitions:
  Pet:
    type: object
    required:
      - name
    properties:
      name:
        type: string
      tag:
        type: string
      age:
        type: integer
