swagger: "2.0"
info:
  title: Petstore
  description: A sample API used as a characterization fixture
  version: "1.0.0"
basePath: /v1
paths:
  /pets:
    get:
      summary: List pets
      tags:
        - pets
      responses:
        "200":
          description: A list of pets
          schema:
            type: array
            items:
              $ref: "#/definitions/Pet"
    post:
      summary: Create a pet
      consumes:
        - multipart/form-data
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/Pet"
      responses:
        "201":
          description: Created
  /pets/{petId}:
    get:
      summary: Get a pet (petId parameter is injected by the generator)
      responses:
        "200":
          description: A pet
          schema:
            $ref: "#/definitions/Pet"
  /pets/{petId}/photos/{photoId}:
    delete:
      summary: Delete a photo (photoId parameter is injected, petId is declared)
      parameters:
        - name: petId
          in: path
          required: true
          type: string
      responses:
        "204":
          description: Deleted
definitions:
  Pet:
    type: object
    required:
      - name
    properties:
      name:
        type: string
      tag:
        type: string
      age:
        type: integer
